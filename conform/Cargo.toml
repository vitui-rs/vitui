# A detached workspace, like `compare/` and for the same reason: the third-party thing is the subject.
# Not a member of the root workspace, so `cargo test --workspace` at the root does not reach it and
# the engine's dependency policy does not govern it.
#
# **No `deny.toml`**, and that is the difference from `fuzz/`. `fuzz/` is a loophole in the dependency
# policy and needs its own gate to stay honest about it; here the emulator under test is the point.
# Detached from the root workspace by this empty table, which is how `compare/` and `fuzz/` do it.
# Without it cargo refuses to build: a manifest inside a workspace directory is assumed to be a member.
[workspace]

[package]
name = "vitui-conform"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

# **Autodiscovery off, and the two arms are declared below.** `examples/common.rs` is a module the arms
# share, not an arm — and autodiscovery would make it an example target of its own and fail it for
# having no `main`. The usual dodge is `examples/common/mod.rs`, a directory holding one `mod.rs`, which
# this workspace does not write. Declaring the targets says which files are arms in one place instead,
# and a third arm adding three lines is a feature rather than a cost: an example nothing declares is an
# example nothing compiles.
autoexamples = false

# No dependencies, matching the engine's and runtime's posture. A dump parser is a state machine over
# bytes and does not need a crate to be one.
[dependencies]

# **The engine is reachable from the examples and not from the library**, which is the same rule as
# `Row` having no `cell_at(column)`: the comparator must not link the code under test, or the
# committed-fixture gate would be checking the engine against itself again — the exact arrangement
# ticket 04 exists because of. Cargo gives examples the dev-dependencies, so the live arm can drive
# the engine while `cargo test`'s gate still runs over a library that has never heard of it.
[dev-dependencies]
vitui-engine = { path = "../crates/vitui-engine" }

[[example]]
name = "ghostty"

[[example]]
name = "tmux"

[lints.rust]
warnings = "deny"
