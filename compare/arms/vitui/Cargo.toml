# The vitui arm of the comparative suite.
#
# A member of `compare/`'s workspace, which is **detached from the repository root** — see
# `../../Cargo.toml` for why. This crate itself takes nothing but the engine, so it would have been
# legal inside the root workspace; it lives here because the arms have to be built and run as one
# set, and one of the others takes ratatui.
[package]
name = "arm-vitui"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
# **The engine alone, and that is now a choice rather than the only option.**
#
# This line used to carry the sentence *a runtime that does not exist yet cannot be in the number*,
# and that precondition has expired: `vitui-runtime` exists, at 20 of 21 tickets. What replaced it
# is not one arm pointed one layer up but **two arms one layer apart** — `arms/vitui-runtime` sits
# beside this one and takes the facade's middle layer, and this one keeps taking the engine.
#
# Two reasons, and the first is about the file this suite produces. `REPORT.md` is committed
# precisely so that a worsening number arrives as a review-visible diff; changing what this arm
# measures would have moved every one of our cells at once, for a reason no cell records, which
# spends that mechanism on a rename. The engine-only rows stay comparable across the suite's history
# because the arm that produces them did not change.
#
# The second is what the pair says that neither says alone: **the runtime's cost on the wire is a
# delta between two of our own arms** — same scenes, same machine, same run. Every other difference
# in this table is a difference between whole frameworks; this is the only one with a single known
# cause, and it is measured rather than argued.
vitui-engine = { path = "../../../crates/vitui-engine", version = "0.0.0" }

[[bin]]
name = "arm-vitui"
path = "src/main.rs"
