name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # Allocation assertions read a process-global counter, so they cannot share a process with
      # other tests. See crates/vitui-alloc-probe.
      - run: cargo test --workspace -- --test-threads=1

  # The dependency policy is a decision, not a preference: the engine takes crossterm and nothing
  # else, and the runtime takes nothing at all. See docs/adr/0001-crossterm-behind-a-seam.md.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Placeholder. The verification-strategy ticket decides how the performance budget becomes a gate
  # rather than a report; until then this only proves the harness compiles and runs.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace -- --test
