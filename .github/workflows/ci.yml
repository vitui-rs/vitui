name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # `cargo test` has no per-test timeout of its own, and a hung test binary is worse than a
    # failing one: it burns a runner for six hours and reports nothing. Every job here carries a
    # ceiling for that reason.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Runs under the workflow's `RUSTFLAGS: -D warnings`, so a lint is a build failure. Any
      # custom `cfg` this workspace ships must therefore be registered where it is defined —
      # `[lints.rust] unexpected_cfgs = { level = "warn", check-cfg = [...] }` in the crate
      # manifest, and again via `cargo::rustc-check-cfg` in the build script once one exists.
      # `unexpected_cfgs` warns by default, and under `-D warnings` a warning is red.
      - run: cargo clippy --workspace --all-targets
      # **The `fuzz` feature, linted here and built nowhere else in this file.** `crate::fuzz` and the
      # reference compositor are compiled by `cargo test` (they are `cfg(any(test, feature = "fuzz"))`)
      # and by the soak, and by nothing in between — so the one configuration that is *feature on,
      # `cfg(test)` off* had no build at all until this line. That configuration is exactly where this
      # ticket's two compile failures were: `LayerRef`, `Paint` and `LayerStack::parts` were
      # `cfg(test)`, and a fuzz target compiles the crate without it. A weekly soak is the wrong place
      # to discover that.
      #
      # `-p vitui-engine` rather than `--workspace`, because `--features` names a feature of one
      # package. Clippy rather than `check`, so it runs under `-D warnings` like everything else.
      - run: cargo clippy -p vitui-engine --all-targets --features fuzz
      # One test command, and it is the serialised one.
      #
      # The allocation probe counts through a process-global counter, and `cargo test` runs a
      # binary's test functions on several threads, so an allocating sibling lands in the number.
      # On the measured lineage that failed on a different binary each run and with a different
      # count each run. The plain `cargo test --workspace` step was deleted rather than kept
      # alongside this one: serialising costs ~9.4 s of in-binary time against a ~10.9 s wall
      # clock, so a second unserialised pass buys nothing back and only adds a way to be flaky.
      #
      # This also runs the doctests, and the doctests are where the negative gates live. A case
      # that must NOT compile is a ```compile_fail``` block paired with an ordinary block that
      # names the same items, so a rename fails the pair instead of silently satisfying it. There
      # is deliberately no `RUSTFLAGS`-flipping "must fail to compile" step here: measured on
      # ticket 18's own negative cases, that step passes when the negative cases are deleted, its
      # positive direction does not compile under this workflow's flags at all, and a
      # `RUSTFLAGS="--cfg ..."` *replaces* `-D warnings` rather than composing with it. See the
      # verification-strategy ticket.
      #
      # **The pty pass is deliberately GitLab-only, and the asymmetry is stated in both files.**
      # `.gitlab-ci.yml` runs this same command a second time under `script -q -e -c`, because a
      # doctest compiles against the crate as a dependency and therefore cannot see the `cfg(test)`
      # guard in `Tty::open` that stops a *unit* test querying the real terminal. It is not
      # duplicated here because this job is a three-OS matrix: `script` takes different arguments on
      # macOS than on Linux and does not exist on Windows, so the portable form would be three
      # branches of shell to gate one property that one runner already gates. The guard itself does
      # run on all three, and it is the half that covers most of the sites.
      - run: cargo test --workspace -- --test-threads=1
      # Engine ticket 23's lint rung, and the control that makes it mean something. It lints
      # `examples/app-template`, which is deliberately **not** a workspace member: `clippy.toml` is
      # read from the crate being linted and `cargo clippy` lints every workspace member it builds,
      # so a fragment inside this workspace would apply spec §11's disallowed-method list to
      # `vitui-engine` itself — which legitimately spawns, joins and locks on the two threads that
      # exist so the app thread does not have to. Then it lints a copy of the template with one
      # `std::thread::sleep` in it and requires that to fail, because a clean result on its own
      # passes for any reason at all, the fragment being inert included.
      #
      # `bash` explicitly, and Windows is skipped: the script is POSIX shell around `cargo clippy`
      # and `git-bash` on the Windows runner resolves paths differently for the temporary copy it
      # makes. The property is per-crate configuration reaching a crate, which is not an
      # operating-system question, so two of the three runners establish it.
      - if: runner.os != 'Windows'
        run: bash scripts/lint-rung-gate.sh
      # `conform/`'s gate. A detached workspace, so `--workspace` above does not reach it.
      #
      # Only the half that can run here: the parser and comparator over the captures committed in
      # `conform/fixtures/`, replayed with no emulator, no window server and no macOS automation
      # grant in the loop. The **live** arm — `cargo run --example ghostty` — is a soak and never
      # runs in CI, for the reason `conform/README.md` gives at length: an emulator's version cannot
      # gate this repository's pull requests, and a hosted runner has neither a window server nor a
      # TCC grant to be asked for.
      #
      # On all three runners deliberately. The comparator is pure byte handling and the captures are
      # committed bytes, so nothing here is platform-specific — which makes Windows the interesting
      # one: it is the arm production ticket 09 says has never been run at all.
      - run: cargo fmt --all --check
        working-directory: conform
      - run: cargo clippy --all-targets
        working-directory: conform
      - run: cargo test
        working-directory: conform

  # The dependency policy is a decision, not a preference: the engine takes crossterm and nothing
  # else, and the runtime takes nothing at all. See docs/adr/0001-crossterm-behind-a-seam.md.
  #
  # It covers dev-dependencies too, and that is not a formality: `criterion` reached `futures-core`
  # and `futures-util` through `plotters` -> `web-sys` -> `js-sys` and made this job red.
  #
  # A `wildcard` error here is fixed by giving the path dependency a `version`, never by loosening
  # `wildcards = "deny"`. A `banned` error is fixed at its source, or the crate joins ADR 0001's
  # `wrappers` list in `deny.toml` with its reason on the same line.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      # **The fuzz workspace, separately, because nothing above can see it.** `fuzz/` has its own
      # `[workspace]` table — `cargo-fuzz` needs nightly and `libfuzzer-sys`, and the engine takes
      # crossterm and nothing else — so its dependencies are outside the graph the step above
      # checks. Spec §14: *that is a loophole, not a permission*. `deny.toml` is resolved beside the
      # manifest, so `fuzz/deny.toml` is what this one reads, and its one delta from the root's is
      # the `NCSA` allowance `libfuzzer-sys` needs for the LLVM sources it vendors.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml

  # The performance budget. Numbers come from `examples/*_numbers.rs` built on `vitui-bench`
  # (round-robin, minimum of forty) and a gate is an `assert_under` inside one of them, so a
  # regression fails the job rather than appearing in a report nobody reads.
  #
  # Not here, and for a stated reason: the comparative suite needs ratatui, Textual and notcurses
  # installed, so it is a separate workflow on a pinned runner and it reports rather than gates.
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release --example budget -p vitui-engine
      # **Ticket 20's gate.** The runtime's dense 300x80 frame, gated at cliff granularity with the
      # 100 us budget reported beside it — the runtime's answer to the engine's `budget` example
      # above. Register entry 12 was red for the absence of exactly this line: both halves of the
      # number existed and neither ran, because a file in `examples/` is compiled by clippy and
      # evaluated by nothing. Here rather than in its own job because the release target directory
      # is already warm.
      #
      # `ubuntu-latest` is a shared runner nobody here has measured, which is precisely why the
      # gate inside that example sits at 2x the budget and not at it — the frame has 1.11x of
      # headroom, and gating at 1.1x on an unmeasured runner is the flaky test `budget.rs` names.
      - run: cargo run --release --example frame -p vitui-runtime
      # Register entry #18: no observer thread is linked into a release binary. Standing requirement
      # 11 is a **release-build** property — measured, an observer converts zero wakeups into ~10 a
      # second for ever — so the observer is `cfg(debug_assertions)`, and a compile outcome about
      # absent code is checked in the one place absent code is visible: the binary. Both directions,
      # because a grep that finds nothing passes for any reason including the message having been
      # reworded. Here rather than in a job of its own because the release target directory is
      # already warm.
      - run: scripts/observer-gate.sh

  # Register entry #17: an idle application costs nothing at all.
  #
  # **A two-runner job and deliberately not a matrix one.** `/usr/bin/time` is BSD's on macOS and
  # GNU's on Linux, with `-l` and `-v` respectively, and Windows has neither — so a third leg would
  # be a third branch of shell for a property two runners already establish. The script picks its
  # own flavour; this file only picks the runners.
  #
  # Thirty seconds per run, because at three the difference between a parked application and a
  # 120 Hz ticker is below the tool's resolution. The count half of the same entry is a unit test in
  # the `test` job above and costs 150 ms.
  idle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GNU `time` is a separate package from the shell builtin and the Ubuntu images do not all
      # carry it. macOS ships BSD's at /usr/bin/time and needs nothing.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y time
      - run: scripts/idle-gate.sh 30
      # **Report #25 is deliberately NOT here, and that is the split this file is for.**
      #
      # `idle-gate.sh` above counts wakeups over thirty idle seconds. Zero is zero on any machine, so
      # it belongs on every runner and it passes on all of them — 2026-09-10 is the first time the
      # claim held anywhere but this project's own hardware.
      #
      # `steady-report.sh` is the opposite: its report is a percentage of a core, and the gate
      # underneath it is `examples/steady.rs`' frame count, which asserts that sixty frames a second
      # actually happened. That is a question about the **machine**, not about this workspace. A
      # shared, virtualised `macos-latest` cannot sustain 60 Hz and failed the floor on the run that
      # first tried it, while `ubuntu-latest` passed — which makes it a coin toss on hosted runners,
      # and a coin toss is how a gate gets disabled within a month.
      #
      # So it stays in `.gitlab-ci.yml`, where the machine is known and is the one `ledger.rs` names
      # beside the number. This matrix answers portability; that runner answers performance. Moving
      # it back here would need a runner whose frame rate is a property of the runner.
