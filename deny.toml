# cargo-deny configuration.
#
# The dependency policy is a decision from the wayfinder maps, not a preference. Runtime ticket 14
# restated it against a split that was built rather than sketched:
#
#   vitui-engine      crossterm (without `event-stream`) plus build-script-generated UCD tables.
#                     Nothing else.
#   vitui-runtime     vitui-engine and nothing else. Layout, reactivity, keys, theming and the data
#                     contract are written by hand and are modules, not crates.
#   vitui-components  vitui-runtime, plus dependencies case by case. It may not name crossterm.
#   vitui-signals     vitui-runtime and nothing else, and nothing in this workspace depends on it.
#   vitui             the facade: engine, runtime, components. Deliberately not signals.
#
# See docs/adr/0001-crossterm-behind-a-seam.md and runtime ticket 14.
#
# Run with: cargo deny check
# Install with: cargo install cargo-deny

[graph]
all-features = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
    # **ADR 0001, enforced instead of reviewed.** "crossterm is invisible" was a rule the map has
    # restated four times and nothing checked: any crate could have added it and `cargo deny` would
    # have said `bans ok`. `wrappers` says *who may depend on it*, so the engine keeps its one
    # dependency and every other crate meets `error[banned]` instead of a code review. Runtime
    # ticket 14 checked this in both directions — the second is a `crossterm.workspace = true` in
    # `vitui-runtime/Cargo.toml`, which fails the gate.
    { name = "crossterm", wrappers = ["vitui-engine"] },

    # **Runtime ticket 14's facade decision, enforced the same way.** R13 built `vitui-signals` and
    # recommended it as a crate; R14 accepts it and keeps it *out of the facade*, because a facade
    # that re-exports one of two reactivity shapes has picked a winner between two that measured
    # identical — 0 of 24 000 differing cells, all inside a ±0.5 µs noise floor. An empty `wrappers`
    # list is that decision: the crate may exist and be published, and nothing in this workspace may
    # depend on it. An application adds one line to its own `Cargo.toml`, which is the visibility
    # the choice deserves.
    #
    # **Ticket 18 built the crate and found that sentence is stronger than it reads.** `[bans] deny`
    # bans a crate's *presence in the graph*, and `wrappers` is the exception list — so a workspace
    # member with nothing depending on it is still banned, and the first `cargo deny check` after the
    # crate was added read `error[banned]: crate 'vitui-signals = 0.0.0' is explicitly banned` with
    # no dependent to name. An empty list is therefore satisfiable only by a crate that is not in this
    # workspace at all, which is why `crates/vitui-signals` is in the root `Cargo.toml`'s `exclude`
    # and carries its own `[workspace]` table. **That is what makes this line live rather than
    # decorative**: it now fires the day a member writes the dependency, naming the wrapper, where
    # before it was already failing for the crate merely existing.
    { name = "vitui-signals", wrappers = [] },

    # Signals that crossterm's `event-stream` feature has been enabled, or that an async runtime has
    # been introduced. Either would break the runtime-agnostic guarantee.
    { name = "futures-core" },
    { name = "futures-util" },
    { name = "tokio" },
    { name = "async-std" },
    # The engine generates its own Unicode tables from UCD; these crates are the tempting shortcut
    # the policy exists to prevent. See the grapheme research for the table shape to generate.
    { name = "unicode-width" },
    { name = "unicode-segmentation" },
]

# NOT banned, deliberately: `mio` and `signal-hook`. crossterm's `events` feature pulls them on every
# platform as its polling implementation — this is not `event-stream` and not an async runtime.
# Verified against crossterm 0.29.0, whose feature table reads
# `events = [dep:mio, dep:signal-hook, dep:signal-hook-mio]`.
#
# The sentence that used to be here — *`events` is the entire reason crossterm is a dependency at
# all* — was **false from impl 20 onward**: the parser is this crate's, crossterm's is unreachable
# without crossterm's reader, and nothing calls into `crossterm::event`. The feature is still on, and
# `Cargo.toml` carries the condition under which it comes off.
#
# NOT used, deliberately: `[bans] allow`, cargo-deny's whole-graph allowlist. It would make
# "`vitui-runtime` takes no dependencies" enforceable *positively* rather than by banning the
# tempting shortcuts one at a time — and runtime ticket 14 measured what it costs: the graph is
# **38 crates** under `all-features = true` across every target, most of them transitive and
# platform-specific (`winapi`, `redox_syscall`, `wasi`, `windows-sys`), so every upstream patch
# release becomes a `deny.toml` edit and the gate's first failure is always a false alarm. The
# negative form above is weaker and stays true without maintenance. This is a judgement with a
# number behind it, not an oversight.
#
# **Runtime ticket 17 re-measured it against the shipped workspace and the number is 33 crates** —
# 27 third-party plus the six members — counted from `Cargo.lock`, which is every target and every
# feature by construction, and confirmed against `cargo deny list`. R14's 38 was its own prototype
# graph and is kept because the drift *is* the argument: the figure moved by five without one edit
# to this file, which is exactly what an allowlist would have turned into a red gate and a false
# alarm. `crate::line`'s `the_dependency_line_is_a_gate_and_the_allowlist_is_refused` is what now
# holds both halves — the two wrapper lines above and the absence of `allow` in `[bans]` — because
# ticket 17 found all three of them true and unchecked.
#
# **Ticket 18 shipped `vitui-signals` and the number did not move**, which is the wrapper line above
# doing exactly what it says. It went to 34 for as long as the crate was a workspace member, and back
# to 33 when the member line came out — see that entry and the root `Cargo.toml`'s `exclude`. The
# number lives in exactly one place, this comment, and `crate::line` reads it.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
