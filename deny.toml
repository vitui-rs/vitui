# cargo-deny configuration.
#
# The dependency policy is a decision from the wayfinder map, not a preference:
#
#   vitui-engine      crossterm (without `event-stream`) plus build-script-generated UCD tables.
#                     Nothing else.
#   vitui-runtime     No dependencies. Reactivity and layout are written by hand.
#   vitui-components  Case by case.
#
# See docs/adr/0001-crossterm-behind-a-seam.md.
#
# Run with: cargo deny check
# Install with: cargo install cargo-deny

[graph]
all-features = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
    # Signals that crossterm's `event-stream` feature has been enabled, or that an async runtime has
    # been introduced. Either would break the runtime-agnostic guarantee.
    { name = "futures-core" },
    { name = "futures-util" },
    { name = "tokio" },
    { name = "async-std" },
    # The engine generates its own Unicode tables from UCD; these crates are the tempting shortcut
    # the policy exists to prevent. See the grapheme research for the table shape to generate.
    { name = "unicode-width" },
    { name = "unicode-segmentation" },
]

# NOT banned, deliberately: `mio` and `signal-hook`. crossterm's `events` feature pulls them on every
# platform as its polling implementation — this is not `event-stream` and not an async runtime, and
# `events` is the entire reason crossterm is a dependency at all. Verified against crossterm 0.29.0,
# whose feature table reads `events = [dep:mio, dep:signal-hook, dep:signal-hook-mio]`.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
