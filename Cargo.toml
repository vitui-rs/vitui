[workspace]
resolver = "3"
members = [
    "crates/vitui",
    "crates/vitui-engine",
    "crates/vitui-runtime",
    "crates/vitui-components",
    "crates/vitui-alloc-probe",
    "crates/vitui-bench",
]
# **Not a member, and the reason is `clippy.toml`.** `cargo clippy` lints every workspace member it
# builds, and clippy reads its configuration from the crate being linted — so a `clippy.toml` inside
# this workspace would apply engine ticket 23's disallowed-method list to `vitui-engine` itself, which
# legitimately spawns, joins and locks on the two threads that exist so the app thread does not have
# to. Excluding the template is what makes that fragment mean *the application author's crate*, which
# is the only thing it can mean: see `examples/app-template/README.md`.
#
# **`crates/vitui-signals` is excluded for a different reason, and it is the rule taken literally.**
# `deny.toml` bans it with an empty `wrappers` list, and cargo-deny bans a crate's *presence* in the
# graph rather than only its dependents — so a member with nothing depending on it still fails
# `cargo deny check` outright. Detaching is the only shape in which *the crate may exist and be
# published, and nothing in this workspace may depend on it* is a sentence a tool can hold. Its
# manifest carries the whole finding; its gates run from the `signals` CI job, because
# `cargo test --workspace` no longer reaches them. See runtime ticket 18.
exclude = ["examples/app-template", "crates/vitui-signals"]

# Every warning is a build failure, in a local `cargo build` exactly as in CI.
#
# **This exists because a weaker local check let a defect reach the pipeline.** CI runs under
# `RUSTFLAGS: -D warnings`, and a plain `cargo clippy --workspace --all-targets` on a developer's
# machine does not — so a `cfg(test)`-gated guard that orphaned two imports passed locally and failed
# the job. The general form is the one engine ticket 16 met twice: *a check that is weaker than the
# gate is not a check.*
#
# `[lints]` rather than a committed `RUSTFLAGS` in `.cargo/config.toml`, and the reason is not the one
# first written here. That one said `RUSTFLAGS` reaches dependencies, so an upstream deprecation would
# fail our build; it does not. **Cargo passes `--cap-lints allow` to every registry dependency**, which
# caps a `deny` back to `allow` — measured, not argued: `RUSTFLAGS="-D unsafe_code" cargo build` builds
# `crossterm` and `mio` clean, and both are full of `unsafe`. The escape is real only for path and git
# dependencies, and in this workspace those are our own crates, whose warnings are ours anyway.
#
# The reason that stands is worse than the one it replaces, and it is the same failure this table
# exists to prevent. **A `RUSTFLAGS` environment variable does not merge with `build.rustflags` — it
# replaces it, silently.** So a developer with `RUSTFLAGS="-C target-cpu=native"` set for any unrelated
# reason loses the deny outright and gets a warning where CI gets an error: *a check that is weaker
# than the gate is not a check*, arriving through the very mechanism meant to enforce it. Verified both
# directions on a throwaway crate — an unused import is an error with no variable set and a warning
# with one. A `[lints]` table cannot be switched off from a shell.
#
# It also covers **clippy**, which is easy to doubt and was doubted in review: `warnings` is not a
# rustc-only group, it names every lint currently at warn level, and clippy-driver applies it to its
# own. Measured: a `clippy::ptr_arg` is an `error` under `cargo clippy` with no `RUSTFLAGS` set. No
# `[workspace.lints.clippy]` table is needed, and adding one would only be for naming individual
# clippy lints at a level other than their default.
#
# It reaches a crate only if that crate says `[lints] workspace = true`, so every manifest here does,
# including the dev-only ones. A new crate that forgets the line is silently exempt — that is the one
# maintenance cost, and it is why the line is in all six rather than in the ones that seemed to
# matter.
[workspace.lints.rust]
warnings = "deny"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# `repository` is deliberately absent and MUST be set before the first `cargo publish`: it read
# `https://github.com/REPLACE-ME/vitui`, there is no public URL for this project yet, and a guessed
# one is a link crates.io would serve to every reader — worse than an absent field, which at least
# says nothing. The only remote is the shared local GitLab, which nobody outside this machine can
# resolve. Removing the key means the six crate manifests lost their `repository.workspace = true`
# too; putting it back means putting those back.
#
# **Verified, not declared, and it was wrong by three releases.** It read `1.85`, which is the
# edition-2024 floor rather than anything measured against this code. `cargo +1.85.0 check
# --workspace --all-targets` and `+1.87.0` both fail with the same fourteen `error[E0658]: 'let'
# expressions in this position are unstable` — ten in `crates/vitui-engine/src/sweep.rs` and four in
# `layer.rs` — because **let-chains stabilised in 1.88**, in edition 2024 only. The compile stops at
# `vitui-engine`, so fourteen is a lower bound on the sites and 1.88 is not: `cargo +1.88.0 check
# --workspace --all-targets` builds every crate and every target clean, as does `-p vitui-engine
# --features fuzz`, the one configuration `cargo test` misses.
#
# The `msrv` job in `.gitlab-ci.yml` is what keeps this number honest. A `rust-version` nothing
# builds against is a claim, not a constraint — and note that raising it here is itself half a gate:
# with `1.88` declared, `cargo +1.87.0 check` now refuses with *rustc 1.87.0 is not supported by the
# following packages* before it compiles anything, which is only useful if some job actually runs an
# old toolchain. Nothing did until that job existed.
#
# **This key is a clippy input, and correcting it is not a no-op — read this before bumping it.**
# Clippy suppresses any lint whose suggested fix needs a newer compiler than the declared MSRV, so a
# `rust-version` that is too low silently switches lints off. Measured on one tree with nothing but
# this line changed: `1.85` gives `cargo clippy --workspace --all-targets` zero errors, `1.88` gives
# **sixteen** — thirteen `clippy::collapsible_if` (the let-chain collapse needs 1.88) and three
# `clippy::manual_is_multiple_of` (`is_multiple_of` landed in 1.87), across ten files in
# `vitui-engine/src/`. Under `[workspace.lints.rust] warnings = "deny"` above, those are errors.
#
# The lints are real and were hidden by a false declaration; they are not an argument for putting
# `1.85` back, and suppressing them with a `[workspace.lints.clippy]` table would be re-hiding them
# by hand. They are a Rust-source fix, `cargo clippy --fix --workspace --all-targets` gets most of
# it, and it is its own change rather than a rider on this one.
rust-version = "1.88"

[workspace.dependencies]
# The engine's only permitted runtime dependency. See docs/adr/0001-crossterm-behind-a-seam.md.
#
# `event-stream` stays disabled — it pulls `futures-core` and would tie the engine to an async
# runtime, breaking the runtime-agnostic guarantee.
#
# `derive-more` is dropped from the defaults: it only adds trait derives to crossterm's public types,
# which we do not expose anyway, and it drags in a proc-macro chain (syn, quote, convert_case,
# unicode-segmentation) purely at build time.
#
# `events` was kept on the rationale that "the input parser is the entire reason this dependency
# exists", and impl 20 found that sentence to be false. crossterm's parser is unreachable without
# crossterm's *reader*: `event::read` opens `/dev/tty` and registers `SIGWINCH` on one poll, and this
# crate already has the single reader that detection needs for its deadline. So the parser is ours
# (`crate::input::parse`) and nothing here calls into `crossterm::event` at all.
#
# The feature is left on, and impl 22 is where that stopped being *handed forward* and became a
# decision with a condition on it. Impl 20 left it here as the terminal-lifecycle ticket's to take,
# on the grounds that removing it forecloses the only `SIGWINCH` this crate could reach. **That
# ground does not survive**: crossterm registers `SIGWINCH` inside the same reader whose bytes this
# crate cannot let it have, so nothing reachable is foreclosed. What removing it buys is four crates
# — `mio`, `signal-hook`, `signal-hook-mio`, `filedescriptor` — and no behaviour.
#
# It stays on for a reason that is about evidence rather than about the tree. The only calls left are
# `IsTty`, `enable_raw_mode`, `disable_raw_mode` and `terminal::size`, and whether those compile
# without `events` is a **per-platform** question: `.github/workflows/ci.yml` names a three-OS matrix
# and this repository has no hosted CI to run it, so one green macOS build is one third of the answer
# to *does this still build on Windows*. A dependency-surface change whose failure mode is an
# operating system nobody watched is not one to take on a third of the evidence, for a benefit that
# is tree size. **It comes off with the first ticket that has a three-OS matrix watched green.**
# Verified again at impl 22 with the feature off: the workspace builds on macOS/arm64 and the four
# crates leave the tree.
crossterm = { version = "0.29", default-features = false, features = [
    "bracketed-paste",
    "events",
    "windows",
] }

vitui-engine = { path = "crates/vitui-engine", version = "0.0.0" }
vitui-runtime = { path = "crates/vitui-runtime", version = "0.0.0" }
vitui-components = { path = "crates/vitui-components", version = "0.0.0" }
vitui-alloc-probe = { path = "crates/vitui-alloc-probe", version = "0.0.0" }
vitui-bench = { path = "crates/vitui-bench", version = "0.0.0" }

# **`vitui-signals` is absent from this table on purpose, and the absence is half a gate.** Every
# entry here exists so that a member can write `.workspace = true`, and no member may write that
# line for signals — so an entry would be a loaded gun beside a rule, inviting the one-word edit
# `cargo deny` exists to refuse. The refusal is enforced three times over: the crate is not in this
# workspace at all (see `exclude` above), `deny.toml`'s empty `wrappers` list fires the moment
# anything pulls it into the graph, and `crates/vitui-signals/tests/facade.rs` reads every manifest
# here and fails if one of them names it. See runtime ticket 18.

[profile.bench]
debug = true

# `codegen-units = 1` was removed by runtime ticket 16, which inherited the decision from runtime
# ticket 14's measurement. On the dense 300x80 screen a single-crate build costs 33.0 us with it and
# 28.7 us at 16, while the four-crate build is 28.7 and 28.4 — four crates are four codegen units
# whatever the setting says, so it is moot on the shipped workspace and costs 4.3 us, 4.3% of the
# frame budget, on the one shape where it is not. Nothing was found that it buys. ThinLTO is what
# earns the inlining back.
[profile.release]
lto = "thin"
