[workspace]
resolver = "3"
members = [
    "crates/vitui",
    "crates/vitui-engine",
    "crates/vitui-runtime",
    "crates/vitui-components",
    "crates/vitui-apps",
    "crates/vitui-alloc-probe",
    "crates/vitui-bench",
]
# The application template is deliberately not a member. Clippy reads `clippy.toml` from the crate
# being linted, so a config file inside this workspace would apply the template's disallowed-method
# list to the engine itself — which legitimately spawns, joins and locks on the two threads that
# exist so the application thread does not have to. Detaching the template is what makes that config
# mean "the application author's crate".
# The component handbook's worked example is detached for a second reason as well as that one: it is
# a directory meant to be copied, so it has to build the way a stranger's crate builds — naming its
# dependencies rather than inheriting them — and being a member would make it a twenty-second
# application in a workspace where the list of applications is something several gates join on.
exclude = ["examples/app-template", "examples/component-handbook"]

# Every warning is a build failure, in a local `cargo build` exactly as in CI.
#
# A `[lints]` table and not a committed `RUSTFLAGS`, because `RUSTFLAGS` in the environment does not
# merge with `build.rustflags` — it replaces it. Anyone with `RUSTFLAGS="-C target-cpu=native"` set
# for an unrelated reason would lose the deny and get a warning where CI gets an error. A `[lints]`
# table cannot be switched off from a shell.
#
# `warnings` names every lint currently at warn level, clippy's included, so a `clippy::ptr_arg` is
# an error here with no `RUSTFLAGS` set and no `[workspace.lints.clippy]` table is needed. It does
# not reach registry dependencies: cargo passes them `--cap-lints allow`.
#
# It reaches a crate only if that crate says `[lints] workspace = true`, so every manifest here
# does, including the dev-only ones. A new crate that forgets the line is silently exempt.
[workspace.lints.rust]
warnings = "deny"

[workspace.package]
# **0.1.0 and not 1.0.0**: these are public crates with no stability promise before 0.x, which is
# the position the READMEs state and which this number is the first to make true. Not 0.0.1 either —
# that is taken by the name-reservation placeholders, which hold the namespace and contain no
# library.
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# Set 2026-09-11, when the project got a public home. Every publishable manifest takes it with
# `repository.workspace = true`; the three that do not publish have no use for it.
repository = "https://github.com/vitui-rs/vitui"

#
# The MSRV is measured, not inherited from the edition: let-chains stabilised in 1.88 and the engine
# uses fourteen of them, so 1.85 and 1.87 both fail to compile this workspace. The `msrv` CI job is
# what keeps the number honest.
#
# Note before bumping it: clippy suppresses any lint whose suggested fix needs a newer compiler than
# the declared MSRV, so this key switches lints on and off. Raising 1.85 to 1.88 surfaced sixteen
# real clippy errors that the low declaration had been hiding.
rust-version = "1.88"

[workspace.dependencies]
# The engine's only permitted runtime dependency, and it is used for terminal mode and input only —
# never for output, and never in a public signature.
#
# `event-stream` stays off: it pulls `futures-core` and would tie the engine to an async runtime.
# `derive-more` stays off: it only derives traits on crossterm types this crate does not expose, and
# costs a proc-macro chain at build time.
#
# `events` is on and nothing calls into `crossterm::event`. The parser is `crate::input::parse`,
# because crossterm's parser is unreachable without crossterm's reader — `event::read` opens
# `/dev/tty` and registers `SIGWINCH` on one poll, and this crate already owns the single reader
# that capability detection needs for its deadline. Turning the feature off drops four crates
# (`mio`, `signal-hook`, `signal-hook-mio`, `filedescriptor`) and changes no behaviour on macOS; it
# stays on until a three-OS matrix has been watched green, because whether `IsTty`,
# `enable_raw_mode`, `disable_raw_mode` and `terminal::size` compile without it is a per-platform
# question and this workspace has never been built on Windows.
crossterm = { version = "0.29", default-features = false, features = [
    "bracketed-paste",
    "events",
    "windows",
] }

vitui-engine = { path = "crates/vitui-engine", version = "0.1.0" }
vitui-runtime = { path = "crates/vitui-runtime", version = "0.1.0" }
vitui-components = { path = "crates/vitui-components", version = "0.1.0" }
# **No `version` key on any of these three, and it is a publish blocker rather than a tidiness rule.**
# All three are `publish = false`, so none will ever be on the registry. A `version` is what tells
# cargo the dependency *will* appear in a published manifest: with one, `cargo package` keeps the
# entry, rewrites the path away and then fails to resolve it — `no matching package named
# `vitui-alloc-probe` found`, on the engine, which is the first crate in the order. Without one,
# cargo drops the dev-dependency from the packaged manifest, which is correct: a consumer of the
# published crate does not build its tests.
vitui-apps = { path = "crates/vitui-apps" }
vitui-alloc-probe = { path = "crates/vitui-alloc-probe" }
vitui-bench = { path = "crates/vitui-bench" }

[profile.bench]
debug = true

# `codegen-units = 1` is deliberately not set. On the dense 300x80 screen a single-crate build costs
# 33.0 us with it and 28.7 us at 16, while the four-crate build is 28.7 and 28.4 — four crates are
# four codegen units whatever the setting says, so it is moot on this workspace and costs 4.3 us,
# 4.3% of the frame budget, on the one shape where it is not. ThinLTO earns the inlining back.
[profile.release]
lto = "thin"
