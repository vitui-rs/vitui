[workspace]
resolver = "3"
members = [
    "crates/vitui",
    "crates/vitui-engine",
    "crates/vitui-runtime",
    "crates/vitui-components",
    "crates/vitui-alloc-probe",
    "crates/vitui-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/REPLACE-ME/vitui"
rust-version = "1.85"

[workspace.dependencies]
# The engine's only permitted runtime dependency. See docs/adr/0001-crossterm-behind-a-seam.md.
#
# `event-stream` stays disabled — it pulls `futures-core` and would tie the engine to an async
# runtime, breaking the runtime-agnostic guarantee.
#
# `derive-more` is dropped from the defaults: it only adds trait derives to crossterm's public types,
# which we do not expose anyway, and it drags in a proc-macro chain (syn, quote, convert_case,
# unicode-segmentation) purely at build time.
#
# `events` is kept and is non-negotiable — the input parser is the entire reason this dependency
# exists. Note that it pulls `mio` and `signal-hook` on every platform; that is crossterm's polling
# implementation, not an async runtime, and it is accepted.
crossterm = { version = "0.29", default-features = false, features = [
    "bracketed-paste",
    "events",
    "windows",
] }

vitui-engine = { path = "crates/vitui-engine", version = "0.0.0" }
vitui-runtime = { path = "crates/vitui-runtime", version = "0.0.0" }
vitui-components = { path = "crates/vitui-components", version = "0.0.0" }
vitui-alloc-probe = { path = "crates/vitui-alloc-probe", version = "0.0.0" }
vitui-bench = { path = "crates/vitui-bench", version = "0.0.0" }

[profile.bench]
debug = true

# `codegen-units = 1` was removed by runtime ticket 16, which inherited the decision from runtime
# ticket 14's measurement. On the dense 300x80 screen a single-crate build costs 33.0 us with it and
# 28.7 us at 16, while the four-crate build is 28.7 and 28.4 — four crates are four codegen units
# whatever the setting says, so it is moot on the shipped workspace and costs 4.3 us, 4.3% of the
# frame budget, on the one shape where it is not. Nothing was found that it buys. ThinLTO is what
# earns the inlining back.
[profile.release]
lto = "thin"
