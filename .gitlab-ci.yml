# The gate set: the five jobs that decide whether a change lands.
#
# Why this exists beside `.github/workflows/ci.yml`: a CI job nobody has watched go green is not a
# gate, whatever it checks. This repository has no hosted CI, so the gates run on a self-hosted
# GitLab that is not publicly reachable, and this file is what its runner executes. Every command
# below is runnable without that runner — the README's *Where the gates run* section maps job to
# command — which is the point of committing the file: it is the definition of what is gated rather
# than a link to a pipeline.
#
# That runner has NO default job image, deliberately: it is shared with other repositories and no
# default is right for more than one of them. The `default: image:` below is therefore required
# rather than decorative — a job that inherited nothing would fail with a config error.
#
# What this does NOT cover, and the GitHub workflow does: the `test` job there is a three-OS matrix
# (ubuntu, macos, windows). A local Docker runner is one OS and one architecture — here,
# linux/arm64. Green here means the gates pass; it does not mean they pass on Windows.
#
# And one gate this file has that the GitHub workflow does not: **`msrv`**. That side deliberately
# tracks `stable` everywhere — it is the early warning that a new release breaks us — and a job
# pinned to the oldest supported toolchain is the opposite question, so it belongs here, on the side
# that pins. The first line above is therefore no longer literally true: these are the same gates
# *plus one*.

workflow:
  rules:
    # Without this, a branch that also has a merge request open builds twice for one push — once as
    # a branch pipeline and once as an MR pipeline. The duplicate does not queue behind the original,
    # it competes with it for runner slots — and the runner is shared with other repositories, so
    # the waste is not even confined to this pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Keep the registry and the build inside the project directory so `cache:` can see them. The
  # default locations are under $HOME, which is thrown away with the job container.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Incremental compilation exists to make the *second* build in a working tree fast. A job
  # container has no second build, so this is cache weight that is never read back.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  GIT_DEPTH: "1"

default:
  # Pinned to an exact patch, not `rust:1-bookworm`.
  #
  # The floating tag was worse than it looked here: the runner is configured `pull_policy =
  # ["if-not-present"]`, so it never re-resolves a tag it already has. This machine was therefore
  # frozen at whatever `rust:1` happened to be on the day it was first pulled, while a second
  # machine would get whatever is current — not reproducible and not up to date, which is the worst
  # of both. Pinning makes the freeze deliberate and visible in a diff.
  #
  # The GitHub workflow deliberately does NOT match this: it uses `dtolnay/rust-toolchain@stable`,
  # so it is the one that catches a new release breaking us. Two jobs, two purposes.
  image: rust:1.97.1-bookworm

  # Only on runner system failure. NOT on `script_failure`, and NOT on
  # `stuck_or_timeout_failure`: a retried flake is a hidden flake, and this repository's position is
  # that a hang is worse than a failure — retrying one buys another twenty minutes of not knowing.
  retry:
    max: 2
    when:
      - runner_system_failure

  # A superseded pipeline holds runner slots the current one needs. The runner is shared across
  # several repositories, so a stale pipeline here delays the others too, not just this one.
  interruptible: true

stages:
  - check

# The five gates are independent and share one stage on purpose, so they run concurrently and the
# pipeline is as long as its slowest job rather than the sum of them. The shared runner allows six
# concurrent jobs, so all five can run at once — but that concurrency is shared with other
# repositories, so a full pipeline elsewhere can still push one of these into a queue.
#
# It was four until `msrv` was added, and that is the last one that fits: a sixth job means this
# pipeline alone can saturate the runner and starve the repositories sharing it. The next gate
# folds into an existing job, the way the two below already do.
#
# **Engine ticket 23's two gates are folded into existing jobs rather than added as a fifth and a
# sixth**, and that is a runner-slot decision with a reason on both counts. The ordinals in that
# sentence and in the `idle` job's note are the counts as those tickets found them, and are left as
# written — they record a decision, not the current job list. `scripts/observer-gate.sh`
# needs a release build and a debug build of one example, and `budget` already has a warm release
# target directory — a job of its own would compile the workspace twice more for two greps.
# `scripts/lint-rung-gate.sh` needs clippy and a check build of a crate that is deliberately outside
# this workspace, and `test` is the job that already installs clippy.

test:
  stage: check
  # `cargo test` has no per-test timeout of its own and a hang is worse than a failure.
  timeout: 20m
  # Per-job cache key. A single shared key across concurrent jobs is a race: they all upload
  # at the end, last writer wins, and the two discarded archives were the ones with the build
  # outputs in them — `test` builds the dev profile and `budget` builds release, so they write
  # disjoint subtrees of `target/` and neither is a superset of the other.
  #
  # Keyed on `Cargo.lock` rather than the branch: the registry only changes when the lock file
  # does, so the cache survives every commit that does not touch dependencies.
  #
  # **Two files, and that is a hard limit rather than a preference.** `cache:key:files` takes at most
  # two entries, and a third fails pipeline *creation* — `too many items (maximum is 2)` — which
  # arrives as a red pipeline holding no jobs at all rather than as a build error, so nothing in a
  # log says what happened. Ticket 18 met it by adding a third, for a lock that moves only when a path
  # dependency inside this repository does — and the root lock moves with it, so the file already
  # listed covers the case worth invalidating on. **Two is the ceiling; do not add a third here.**
  cache:
    key:
      files:
        - Cargo.lock
        - conform/Cargo.lock
      prefix: test
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - target
      # `conform/` is a detached workspace with a target directory of its own, and this job is the
      # only one that builds it. Without this line its dev-dependency on the engine is compiled cold
      # on every run.
      - conform/target
  script:
    # Not redundant, and do not delete it: the official `rust` images are built with rustup's
    # `minimal` profile, so `cargo fmt` and `cargo clippy` are both absent and the next two lines
    # fail with "is not installed for the toolchain".
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    # Runs under `RUSTFLAGS: -D warnings` above, so a lint is a build failure. Any custom `cfg`
    # this workspace ships must be registered where it is defined — `[lints.rust] unexpected_cfgs`
    # in the crate manifest, and `cargo::rustc-check-cfg` in the build script once one exists.
    - cargo clippy --workspace --all-targets
    # **The `fuzz` feature, linted here and built nowhere else in this file.** `crate::fuzz` and the
    # reference compositor are compiled by `cargo test` (they are `cfg(any(test, feature = "fuzz"))`)
    # and by the soak, and by nothing in between — so the one configuration that is *feature on,
    # `cfg(test)` off* had no build at all until this line. That configuration is exactly where this
    # ticket's two compile failures were: `LayerRef`, `Paint` and `LayerStack::parts` were
    # `cfg(test)`, and a fuzz target compiles the crate without it. A weekly soak is the wrong place
    # to discover that.
    #
    # `-p vitui-engine` rather than `--workspace`, because `--features` names a feature of one
    # package. Clippy rather than `check`, so it runs under `-D warnings` like everything else.
    - cargo clippy -p vitui-engine --all-targets --features fuzz
    # The public surface is what the runtime author reads, so a broken intra-doc link on it is a
    # defect and not a cosmetic. **Added by engine ticket 24, which found eight of them** — five
    # older than this job's last green run, because nothing here was documenting anything and a link
    # that resolves to a private item is invisible to `cargo build`, to `cargo clippy` and to
    # `cargo test` alike.
    #
    # What makes it a gate rather than a warning is **`[workspace.lints.rust] warnings = "deny"` in
    # `Cargo.toml`, and not the `RUSTFLAGS` above**: cargo passes `RUSTFLAGS` to `rustc` and
    # `RUSTDOCFLAGS` to `rustdoc`, so the variable on line 23 reaches this command not at all.
    # Measured with `RUSTFLAGS` unset — `rustdoc::broken_intra_doc_links` still errors, and the
    # diagnostic names `-D warnings` as the reason. Deleting that table would leave this line green
    # on a broken link. It also covers only the **public** surface, which is what the sentence above
    # claims: rustdoc does not document private items, so it does not lint their links either.
    - cargo doc --workspace --no-deps
    # One test command, and it is the serialised one. The allocation probe counts through a
    # process-global counter and `cargo test` runs a binary's tests on several threads, so an
    # allocating sibling lands in the number. The unserialised pass is deliberately absent — it
    # buys nothing back and only adds a way to be flaky. This also runs the doctests, and the
    # doctests are where the negative gates live.
    - cargo test --workspace -- --test-threads=1
    # **The one thing the line above cannot assert about itself.** Every allocation gate in this
    # workspace opens a process-wide window on a thread the harness spawned, and the harness's own
    # thread is then blocked on a channel whose first receive allocates. That cost landed inside a
    # gate's window once in six hosted runs, on a function that cannot reach an allocator. The probe
    # excludes the process's first thread from every reading now, and this reproduces the race on
    # demand to show that the exclusion is still doing it — which no test can, because the
    # interfering thread has to be the first one and in a test binary that thread is the harness's.
    #
    # An example, and therefore a line here: `cargo test` does not run one, and a gate nothing runs
    # is not a gate. Debug artifacts are standing from the line above.
    - cargo run -p vitui-alloc-probe --example harness_race
    # And once more with a terminal on the other end, which is a **different environment and not a
    # second roll of the same dice** — the distinction the unserialised pass above fails to make and
    # this one does.
    #
    # Engine ticket 16 is the evidence. `attach` performs live capability detection when
    # `Config::output` is `Output::Terminal`, which is the default, and three tests plus seven
    # doctests were using it. libtest does not redirect fd 1, so in a real terminal they enabled raw
    # mode, wrote a 277-byte query batch onto the developer's screen, ate their keystrokes and failed
    # with `NoAnswer`. **A job container has no tty, so this file said green while every human was
    # broken** — the same shape as "a CI job nobody has watched go green is not a gate", arriving
    # from the other side: *a test that reaches for real I/O passes in the environment that has
    # none.*
    #
    # `Tty::open` now panics under `cfg(test)`, which covers the unit tests structurally and costs
    # nothing. It cannot cover a **doctest**: those compile against the crate as a dependency,
    # without `cfg(test)`, and seven of the ten sites were doctests. This line is that half.
    #
    # `-e` is load-bearing. Without it `script` exits 0 whatever the child did, and this becomes a
    # gate that cannot fail — a flaky test wearing a budget's clothes, which §14 names exactly.
    # Verified against this image: `script -q -e -c false /dev/null` exits 1.
    - script -q -e -c "cargo test --workspace -- --test-threads=1" /dev/null
    # Engine ticket 23's lint rung, and the control that makes it mean something. It lints
    # `examples/app-template`, which is **not** a workspace member — `clippy.toml` is read from the
    # crate being linted and `cargo clippy` lints every workspace member it builds, so a fragment
    # inside this workspace would apply the disallowed-method list to `vitui-engine` itself. Then it
    # lints a copy of the template with one `std::thread::sleep` in it and requires that to fail,
    # because a clean result on its own passes for any reason including the fragment being inert.
    # **Fifty pictures, and whether each is still the screen it is a picture of.**
    #
    # The components' half is a `cargo test` above — a library function draws a panel, so a test can
    # take one and compare it, blessing included. The applications' half cannot be: an application is
    # an *example*, `cargo test` does not run one, and each of the twenty writes its own. So the
    # drift check is a script, and it is here rather than in `idle` because the debug artifacts are
    # already standing.
    #
    # One picture is excluded and the script says which and why: `latency` draws a measured duration,
    # and a timing is a report rather than an equality.
    - scripts/shots.sh --check
    # **The three recordings, which the line above cannot reach.** A still is re-taken and diffed; a
    # GIF is VHS and ffmpeg over thirteen seconds of a live terminal, which is not available on a
    # runner and is not byte-reproducible anyway. So this asks the cheaper question — have the tape,
    # the application or its still changed since the recording was made — and it exists because the
    # answer was yes for four days and a review, not a gate, is what found it.
    - scripts/recordings-gate.sh
    - scripts/lint-rung-gate.sh
    # **Components register row 221, and it is in *this* job rather than `idle` for two reasons that
    # are both about this job's cache and this job's image.** It is the one instrument on that
    # register which is not a `cargo` invocation: a `cargo test` has no terminal to leave in a state,
    # so *the gallery gives the terminal back before a panic prints* is checked by driving the shipped
    # binary under a real pty and comparing two byte offsets.
    #
    # `idle` was the obvious home — it is already two shell gates — and it is the wrong one. Its two
    # scripts build `--release`, and nothing under its cache prefix has ever built a dev profile or
    # any crate above the engine, so the same line there is a cold whole-workspace debug compile
    # inside a 10-minute timeout. Here the debug artifacts are already standing from
    # `cargo test --workspace` four lines up, and `script(1)` is proven present by the line above
    # that one using it.
    #
    # The script fails naming what it could not use if `script` is missing, which is the right
    # failure and still a failure — a gate that skipped itself is `compare/run.sh` again.
    - scripts/gallery-panic-gate.sh
    # **Register entry #30 on a real pty, and this job is where the pty gates live.** The in-crate
    # half — `crate::gates::nothing_reaches_the_users_own_page` — runs under `cargo test` above and
    # counts `?1049h` over the two functions that produce the bytes. It cannot run the path those
    # bytes take: `Tty::open` panics under `cfg(test)`, so no test here ever reaches a terminal and
    # `attach`'s actual write order on a tty is unreachable from inside the crate.
    #
    # This is that path, and the shape is the one the line eighty above already relies on. The
    # numbers are the same ones too: with production ticket 12's defect reintroduced the script names
    # **277 bytes on the user's own page** — the same 277-byte query batch that comment describes
    # landing on a developer's screen, which is a coincidence worth noticing rather than a citation.
    # Debug artifacts for `vitui-apps` are already standing from `cargo clippy --all-targets`.
    - scripts/page-order-gate.sh
    # **Register entry #31, and it is the third pty gate in this job for the same reason as the two
    # above.** `Tty::open` panics under `cfg(test)`, so no test in this workspace ever spawns the
    # thread this entry is about — the one that keeps reading standard input for the whole of a
    # `Screen::suspend`, because safe Rust cannot cancel a blocking `read`. Every keystroke a
    # headless gate sees was put in the queue by `Screen::inject`, on this side of the reader.
    #
    # **It asserts a refusal**, which is unusual enough to say here rather than only in the script:
    # nothing is trying to make the reader stop, and if an edit ever does, this goes red on purpose
    # and takes `Screen::suspend`'s first paragraph, `Screen::resume`'s discard and ADR 0052 with it.
    # Its two arms are one keystroke before a suspension and one during it, and the first is the
    # control — a pty that delivers nothing at all reports exactly what a stopped reader reports.
    #
    # Under a second on the runner, and `script(1)` is proven present by the two lines above.
    - scripts/suspend-reader-gate.sh
    # **`conform/`'s gate, folded in rather than added as a sixth job** — the same runner-slot
    # decision the note above these jobs makes for the observer gate and the lint rung, and the one
    # that note says the *next* gate would have to make.
    #
    # What runs here is only the half that can: the parser and comparator over the captures committed
    # in `conform/fixtures/`, which is bytes a real terminal really sent, replayed with no emulator,
    # no window server and no macOS automation grant in the loop. The **live** arm —
    # `cargo run --example ghostty` — is a soak and never runs here, for the reason
    # `conform/README.md` gives at length: an emulator's version cannot gate this repository's pull
    # requests, and a fresh runner has neither a window server nor a TCC grant to be asked for.
    #
    # `cargo test` and not `cargo test --lib`: the live arm is an example, and an example nothing
    # compiles is an example that rots. Compiling it is what keeps the driver honest against the
    # engine's public surface, which is the thing most likely to move underneath it.
    #
    # A subshell, so a failure is still this job's failure and the cached working directory is not
    # left somewhere else — the same shape as the `fuzz` line in `deny`.
    - (cd conform && cargo fmt --all --check && cargo clippy --all-targets && cargo test)

# The MSRV, and until this job existed `rust-version` was a comment with a colon in it.
#
# `Cargo.toml` declared `1.85`, every job in this file pins `rust:1.97.1-bookworm` and the GitHub
# workflow tracks `stable`, so **nothing anywhere compiled this workspace on the version it claims to
# support**. It was wrong by three releases: let-chains stabilised in 1.88 and `vitui-engine` uses
# fourteen of them. The same shape as the two failures the notes above record — *a check that is
# weaker than the gate is not a check* — arriving as a check that did not exist at all.
#
# The image names the MSRV rather than installing a toolchain into `rust:1.97.1-bookworm`, because
# `rustup toolchain install 1.88.0` downloads a second toolchain on every run and the tag is the
# thing being tested. **Bump it and `rust-version` in the same commit, never one of them**: a diff
# where they disagree is the defect this job exists to catch, and it should be visible as one.
#
# `check` rather than `clippy`, and that is deliberate rather than lazy. This job asks *does the MSRV
# still compile the workspace*, and clippy's lint set moves between releases — a lint added in 1.90
# that fires here would fail the job for a reason that has nothing to do with the MSRV, and `RUSTFLAGS:
# -D warnings` above turns it into an error rather than a warning. The `test` job on the pinned recent
# toolchain is where linting belongs. For the same reason nothing here runs `cargo test`: a test
# failure on an old rustc is a fact about the test, and this job is about the compiler.
#
# `--all-targets` is load-bearing — without it the examples, benches and test targets are not built,
# and `examples/` is where a newer-than-MSRV call would most plausibly land unnoticed.
#
# `--features fuzz` gets its own line for the same reason the `test` job gives at length: that
# configuration is *feature on, `cfg(test)` off*, and it is compiled nowhere else in this file.
msrv:
  stage: check
  timeout: 15m
  # The MSRV declared in `[workspace.package] rust-version`. See the comment on that key. Named
  # explicitly, like every job here must be: the shared runner has no default image.
  #
  # `bookworm` to match the pinned tag above rather than `-slim` or `-alpine`, so this job differs
  # from `test` in exactly one variable — the toolchain — and a failure here is about rustc and not
  # about a missing system library. Checked multi-arch before pinning: the tag publishes
  # linux/arm64/v8, which is what this runner is.
  image: rust:1.88.0-bookworm
  # Per-job cache key, like its neighbours, and for the reason `test` states: concurrent jobs sharing
  # one key race on upload and the last writer wins. This one holds a *different toolchain's* build
  # artefacts than every other job here, so sharing a prefix with them would thrash rather than hit.
  cache:
    key:
      files:
        - Cargo.lock
      prefix: msrv
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - target
  script:
    # Prove the image is the toolchain this job claims to test. Without it a retagged or mismatched
    # image turns a green MSRV gate into a second run of `test` on a different rustc, which is the
    # failure mode that is invisible in a log nobody reads.
    - cargo --version
    - rustc --version | grep -q '1\.88\.0'
    - cargo check --workspace --all-targets
    - cargo check -p vitui-engine --all-targets --features fuzz

deny:
  stage: check
  timeout: 10m
  # The dependency policy is a decision, not a preference: the engine takes crossterm and nothing
  # else, and the runtime takes nothing at all. See docs/adr/0001-crossterm-behind-a-seam.md.
  #
  # A `wildcard` error is fixed by giving the path dependency a `version`, never by loosening
  # `wildcards = "deny"`. A `banned` error is fixed at its source, or the crate joins ADR 0001's
  # `wrappers` list in `deny.toml` with its reason on the same line.
  variables:
    # Pinned here and deliberately NOT pinned on GitHub, which uses
    # `EmbarkStudios/cargo-deny-action@v2` and therefore whatever cargo-deny is current. The two
    # are not meant to match: the floating one is the early warning that a new advisory or a new
    # cargo-deny release has something to say about us, and this one is the reproducible gate. The
    # split is the same one the toolchain makes above, for the same reason.
    CARGO_DENY_VERSION: "0.20.2"
  # This job never builds the workspace, so it has no use for `target/` or the registry. What it
  # does re-fetch every run is the RustSec advisory database, and that is what is cached.
  cache:
    key: deny-advisory-db
    paths:
      - .cargo/advisory-dbs
  script:
    # The prebuilt binary rather than `cargo install --locked`, which is four minutes of compiling
    # a linter on every run. The fallback exists because the asset naming is upstream's to change.
    - |
      set -eu
      arch=$(uname -m)
      url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-${arch}-unknown-linux-musl.tar.gz"
      if curl -fsSL "$url" -o /tmp/cargo-deny.tar.gz; then
        tar -xzf /tmp/cargo-deny.tar.gz -C /tmp --strip-components=1
        install /tmp/cargo-deny /usr/local/bin/cargo-deny
      else
        echo "no prebuilt binary at $url; falling back to cargo install" >&2
        # `RUSTFLAGS` is cleared for this one command. It is `-D warnings` for *this workspace*, and
        # letting it escape into a third-party build means an upstream deprecation warning fails our
        # dependency gate for a reason that has nothing to do with our dependencies.
        RUSTFLAGS= cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      fi
      # The download is an executable that is about to run in CI, fetched over a URL built by string
      # concatenation. Asserting the version it reports is not a substitute for a checksum, but it
      # does catch a truncated download, a redirect to an error page, and the wrong architecture —
      # each of which would otherwise surface as a confusing failure inside `cargo deny check`.
      #
      # `cargo deny`, not the bare `cargo-deny`. The two paths above put the binary in two different
      # places: the download goes to /usr/local/bin, which is on PATH, but `cargo install` goes to
      # $CARGO_HOME/bin — and CARGO_HOME is overridden to $CI_PROJECT_DIR/.cargo above, which is
      # not. Cargo resolves its own subcommands from $CARGO_HOME/bin, so going through cargo is the
      # form that works on both.
      cargo deny --version | grep -q "${CARGO_DENY_VERSION}"
    - cargo deny check
    # **The fuzz workspace's own invocation, and it is not a formality.** `fuzz/` is detached — it
    # has its own `[workspace]` table, because `cargo-fuzz` needs nightly and `libfuzzer-sys` and the
    # engine's policy is crossterm plus generated UCD tables and nothing else. So the line above
    # cannot see a single crate in there, and spec §14 names that in as many words: *that is a
    # loophole, not a permission*. Added by engine ticket 25, with `fuzz/deny.toml` beside it.
    #
    # A subshell, so a failure here is still this job's failure and the working directory the runner
    # cached is not left somewhere else.
    - (cd fuzz && cargo deny check)

budget:
  stage: check
  timeout: 15m
  # The performance budget. A gate is an `assert_under` inside the example, so a regression fails
  # the job rather than appearing in a report nobody reads.
  #
  # The numbers this prints are worth what a laptop under load is worth. It is here as a gate on
  # the cliffs, not as a measurement anyone should quote.
  cache:
    key:
      files:
        - Cargo.lock
      prefix: budget
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - target
  script:
    - cargo run --release --example budget -p vitui-engine
    # **Ticket 20's gate, and the line that makes it one.** `examples/frame.rs` is the runtime's
    # answer to the engine's `budget` example above: the dense 300x80 frame, gated at cliff
    # granularity with the 100 us budget reported beside it.
    #
    # **Register entry 12 was red for the absence of exactly this line.** Both halves of the number
    # already existed — `crate::line`'s in-binary arm, which returns early without `line=1`, and
    # `examples/crate_line_numbers.rs`, which prints it — so the frame was *measured* twice and
    # *gated* nowhere. A file in `examples/` is compiled by `cargo clippy --all-targets` and
    # evaluated by nothing, which is why an `assert!` there was not a gate until a job ran it.
    #
    # Here rather than in a job of its own for the reason the note above these jobs gives twice
    # already: this job's release target directory is warm, and a sixth job means this pipeline
    # alone can saturate a runner shared with other repositories.
    - cargo run --release --example frame -p vitui-runtime
    # Register entry #18: no observer thread is linked into a release binary. A compile outcome about
    # *absent* code, so it is checked in the one place absent code is visible — the binary. Here
    # rather than in a job of its own because the release target directory is already warm.
    - scripts/observer-gate.sh

# Register entry #17: an idle application costs nothing at all.
#
# The count half is a unit test in the `test` job and costs 150 ms. This is the half that is a claim
# about a *process* — `0.00 user 0.00 sys` — and it needs thirty seconds, because at three the
# difference between a parked application and a 120 Hz ticker is below the tool's resolution.
#
# One runner here and two on GitHub: `/usr/bin/time` is GNU's on this image and BSD's on macOS, with
# `-v` and `-l` respectively, and the script picks its own flavour. This file is the GNU half.
idle:
  stage: check
  timeout: 10m
  cache:
    key:
      files:
        - Cargo.lock
      prefix: idle
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - target
  script:
    # GNU `time` is a separate package from the shell builtin, and the official `rust` images do not
    # carry it. Without this the script exits naming the flag it could not use, which is the right
    # failure and still a failure.
    - apt-get update && apt-get install -y --no-install-recommends time
    - scripts/idle-gate.sh 30
    # **Report #25, folded into this job rather than added as a fifth**, and it is the same
    # runner-slot decision the note above the four jobs makes twice already. It needs GNU `time`,
    # which the line above just installed, and a release build of one example in a target directory
    # this job's cache already holds — a job of its own would install a package and compile a
    # workspace again for a number nobody gates on.
    #
    # It is entry #17's neighbour rather than a second copy of it: #17 is thirty **idle** seconds at
    # `0.00 user 0.00 sys`, and this is thirty seconds at **60 frames a second**, which is a different
    # question and had never been measured. Impl 26 measured it at 0.133% of a core against a 5%
    # budget, where the arithmetic it replaces said 0.0029%.
    #
    # A report, so it prints and does not fail the job on the percentage. The gate underneath it is a
    # frame *count* inside `examples/steady.rs`, which aborts if the run was not a steady state — a
    # percentage measured over four frames is not a measurement of one.
    - scripts/steady-report.sh 30
