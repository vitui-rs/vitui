[package]
name = "vitui-engine"
description = "Cells, surfaces, layers, compositing and damage tracking for terminal rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
# `repository` is absent from `workspace.package` on purpose; see the root `Cargo.toml`. Restore
# `repository.workspace = true` here when the key goes back.
rust-version.workspace = true

# Written out, though cargo would auto-detect a README in the package directory: a key on the page
# is a key a reader can see is wrong. Not `readme.workspace = true` — each crate's front page is
# about that crate, and one shared file would put the wrong story on three of the four crates.io
# pages.
readme = "README.md"

# The one feature this crate has, and it exists for the fuzz targets rather than for callers. It
# compiles the reference compositor and `crate::fuzz`, the two libFuzzer harnesses, for a crate that
# cannot be a workspace member: `cargo-fuzz` needs nightly and `libfuzzer-sys`, so `fuzz/` is its
# own workspace and reaches this one as a path dependency with `features = ["fuzz"]`.
#
# Off by default and hidden from rustdoc, so an ordinary build, an ordinary `cargo doc` and an
# ordinary dependent see none of it. A test in `crate::audit` asserts both halves.
[features]
fuzz = []

[dependencies]
crossterm.workspace = true

[dev-dependencies]
vitui-bench.workspace = true
vitui-alloc-probe.workspace = true

[lints]
workspace = true
