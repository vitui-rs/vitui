[package]
name = "vitui-engine"
description = "Cells, surfaces, layers, compositing and damage tracking for terminal rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
# `repository` is absent from `workspace.package` on purpose; see the root `Cargo.toml`. Restore
# `repository.workspace = true` here when the key goes back.
rust-version.workspace = true

# **Explicit, and cargo would have found it anyway.** A README in the package directory is
# auto-detected, so this line changes nothing about what gets published — it is here because
# ticket 01's whole finding was that a `rust-version` nobody checked had been switching lints off
# for three releases. A key that is written down is a key a reader can see is wrong.
#
# It is **not** `readme.workspace = true`, and cannot usefully be: the four publishable crates have
# genuinely different stories — the engine is complete, the runtime is half built, the components
# crate is empty — and one shared file would put "components is empty scaffolding" on the engine's
# crates.io page. Nothing gates this; a missing README surfaces as a `cargo publish` that ships a
# blank front page, which is the first publish and not this commit.
readme = "README.md"

# **The one feature this crate has, and it is not a knob.** It compiles the reference compositor and
# `crate::fuzz` — the two fuzz-target harnesses spec §14 asks for — for a crate that cannot be a
# workspace member: `cargo-fuzz` needs nightly and `libfuzzer-sys`, so `fuzz/` is its own workspace
# and reaches this one as a path dependency with `features = ["fuzz"]`.
#
# It is **off by default and hidden from rustdoc**, so an ordinary build, an ordinary `cargo doc` and
# an ordinary dependent see none of it. `crate::audit`'s `the_fuzz_door_is_behind_a_feature_and_hidden`
# is what asserts that, in this file as well as in the crate root: §15 leaves feature flags and the
# release policy undecided, and a feature that quietly turned on by default would be deciding it.
[features]
fuzz = []

[dependencies]
crossterm.workspace = true

[dev-dependencies]
vitui-bench.workspace = true
vitui-alloc-probe.workspace = true

[lints]
workspace = true
