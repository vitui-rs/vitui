[package]
name = "vitui-runtime"
description = "Layout, identity, focus, hit-testing, routing, key maps and theming on top of vitui-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Written out, though cargo would auto-detect a README in the package directory: a key on the page
# is a key a reader can see is wrong. Not `readme.workspace = true` — each crate's front page is
# about that crate, and one shared file would put the wrong story on three of the four crates.io
# pages.
readme = "README.md"

# How crates.io search finds this crate at all. Five keywords is the ceiling and each is a word
# somebody would type, not a word that describes us to ourselves.
keywords = ["tui", "terminal", "layout", "ui", "console"]
categories = ["command-line-interface", "gui"]

# Dependency policy: this crate takes no dependencies beyond the engine. Layout, keys, theming,
# animation and the data contract are written by hand and are modules of it. There is no reactivity
# here and none is planned — a signal layer was built, measured at a 0.21% spread across three
# drivers of one screen, and deleted. Do not add a crate here without a decision.
[dependencies]
vitui-engine.workspace = true

# Dev only, so the policy above is untouched and nothing here reaches a dependent's graph.
# `vitui-bench` is this workspace's own round-robin minimum-of-N timing harness.
[dev-dependencies]
vitui-bench.workspace = true
# The counting global allocator, for the allocation gates: "no allocation during a frame" is a
# count, and a count needs something that counts.
vitui-alloc-probe.workspace = true

[lints]
workspace = true
