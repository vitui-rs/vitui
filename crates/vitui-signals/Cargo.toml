# **A detached workspace, and it is not a convenience — it is what the rule turns out to mean.**
#
# `deny.toml` carries `{ name = "vitui-signals", wrappers = [] }`, which runtime ticket 14 wrote as
# *the crate may exist and be published, and nothing in this workspace may depend on it.* Ticket 18
# built it and found the second half of that sentence is stronger than it reads: cargo-deny's
# `[bans] deny` bans a crate's **presence in the graph**, and `wrappers` is the exception list. A
# member with no dependents is still in the graph, so the very first `cargo deny check` after the
# crate was added read
#
#     error[banned]: crate 'vitui-signals = 0.0.0' is explicitly banned
#
# with no dependent to name. An empty `wrappers` list is therefore satisfiable only by a crate that
# is not in this workspace's graph at all — which is what the empty table below does, and what
# `fuzz/`, `compare/`, `conform/` and `examples/app-template` already do for four other reasons.
#
# **This makes the ban live rather than decorative.** Detached, the crate is invisible to
# `cargo deny check` at the root; the moment a member writes a dependency on it, it enters the graph
# and the ban fires with the wrapper named. That is the gate working, and it could not fire at all
# while the crate was a member, because it was already failing for being present.
#
# Without the empty table cargo refuses to build: a manifest inside a workspace directory is assumed
# to be a member.
[workspace]

[package]
name = "vitui-signals"
description = "A fine-grained signal graph for vitui — outside the facade, and outside its workspace"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Follows the workspace next door, which was corrected from 1.85 on 2026-08-22: let-chains need 1.88.
# A detached non-member, so the root's `msrv` job does not cover this crate — see the `signals` job
# in `.gitlab-ci.yml`, which is where its gates run at all.
rust-version = "1.88"
readme = "README.md"

# **The whole shipped dependency list, and it is the ticket's first acceptance criterion.** Not
# `vitui-engine` and not `vitui`, in dependencies **or** dev-dependencies — a dev-dependency on the
# engine would let the gates below reach a type the shipped crate cannot, which is exactly the seam
# runtime ticket 17 built the components package to hold. What that refusal costs is written down in
# `tests/drivers.rs`: no cell is readable from outside the engine (ADR 0023), so the cell equality is
# the application's own ledger of its own writes rather than a read-back of the composited screen.
[dependencies]
vitui-runtime = { path = "../vitui-runtime", version = "0.0.0" }

# **Dev only, and the line above is untouched** — the same two instruments `vitui-runtime` and
# `vitui-engine` take, in the same place and for the same reason. `vitui-bench` is the workspace's
# round-robin minimum-of-N harness and `vitui-alloc-probe` is the counting global allocator; a report
# needs an instrument exactly as *no allocation* needs something that counts, and neither can name an
# engine type.
#
# **Path-only, with no `version` key, and that is deliberate.** Both are `publish = false`, and cargo
# strips a dev-dependency that carries no version requirement when it packages — so `cargo publish`
# here does not go looking on crates.io for two crates that will never be there.
[dev-dependencies]
vitui-bench = { path = "../vitui-bench" }
vitui-alloc-probe = { path = "../vitui-alloc-probe" }

# The same `deny` the workspace next door uses, for the same reason: a check that is weaker than the
# gate is not a check. A detached workspace inherits nothing, so this table is what keeps an unused
# import here an error rather than a warning.
[lints.rust]
warnings = "deny"
