[package]
name = "vitui"
description = "A fast, layered TUI library for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Written out, though cargo would auto-detect a README in the package directory: a key on the page
# is a key a reader can see is wrong. Not `readme.workspace = true` — each crate's front page is
# about that crate, and one shared file would put the wrong story on three of the four crates.io
# pages.
readme = "README.md"

# How crates.io search finds this crate at all. Five keywords is the ceiling and each is a word
# somebody would type, not a word that describes us to ourselves.
keywords = ["tui", "terminal", "ui", "console", "text"]
categories = ["command-line-interface", "gui"]

[dependencies]
vitui-engine.workspace = true
vitui-runtime.workspace = true
vitui-components.workspace = true

[lints]
workspace = true
