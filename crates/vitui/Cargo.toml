[package]
name = "vitui"
description = "A fast, layered TUI library for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
# `repository` is absent from `workspace.package` on purpose; see the root `Cargo.toml`. Restore
# `repository.workspace = true` here when the key goes back.
rust-version.workspace = true

# Written out, though cargo would auto-detect a README in the package directory: a key on the page
# is a key a reader can see is wrong. Not `readme.workspace = true` — each crate's front page is
# about that crate, and one shared file would put the wrong story on three of the four crates.io
# pages.
readme = "README.md"

[dependencies]
vitui-engine.workspace = true
vitui-runtime.workspace = true
vitui-components.workspace = true

[lints]
workspace = true
