# The applications, as examples. Not a library anybody depends on.
#
# A workspace member so that CI builds it: these are the first consumers this library has, and a
# consumer nobody builds is a consumer nobody checks. An application that stops compiling against
# the component surface fails the pipeline instead of rotting quietly.
#
# No `clippy.toml` here, deliberately. The application-author lint rung belongs to
# `examples/app-template`, which sits outside the workspace so that its disallowed-method list means
# "the application author's crate" — clippy reads its config from the crate being linted, and a copy
# inside the workspace would apply the rung to the engine, which legitimately spawns, joins and
# locks.
[package]
name = "vitui-apps"
description = "Applications written against the vitui component surface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"

# Never published: an instrument is not part of the library and neither is a demonstration.
publish = false

# The runtime and the components, and deliberately not the engine.
#
# An application is allowed to name the engine — `examples/app-template` does. Not naming it here
# is what makes every program in this directory a standing proof that the component-facing surface
# is sufficient: one that could only be written by reaching past the runtime would say the surface
# is unfinished, and it would say so silently.
#
# The two names rather than the `vitui` facade, for the same reason: the facade re-exports the
# engine entire — `Surface`, `View`, `Screen`, `Engine`, `LayerStack` — and the proof would
# evaporate without a line changing. The engine's *vocabulary* is reachable through the runtime on
# purpose (`Rect`, `Mouse`, `Mods`), which is the seam working rather than a hole in it: an
# application that needs a `View` is an application with a finding.
[dependencies]
vitui-runtime.workspace = true
vitui-components.workspace = true

[lints]
workspace = true
