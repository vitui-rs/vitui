[package]
name = "vitui-components"
description = "Windows, panels, charts, lists, trees, forms and pickers built on vitui-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
# `repository` is absent from `workspace.package` on purpose; see the root `Cargo.toml`. Restore
# `repository.workspace = true` here when the key goes back.
rust-version.workspace = true

# Written out, though cargo would auto-detect a README in the package directory: a key on the page
# is a key a reader can see is wrong. Not `readme.workspace = true` — each crate's front page is
# about that crate, and one shared file would put the wrong story on three of the four crates.io
# pages.
readme = "README.md"

[dependencies]
vitui-runtime.workspace = true

# Dev only. The rule this crate lives under is that its library depends on the runtime and cannot
# name the engine; a dev-dependency is not part of that, because no consumer of the published crate
# ever compiles one. `vitui-alloc-probe` is the counting global allocator the allocation gates
# need, and it is what lets `tests/budget.rs` measure a frame from a crate that cannot name the
# engine.
[dev-dependencies]
vitui-alloc-probe.workspace = true
# Dev only, for the same reason. `vitui-bench` is the round-robin minimum-of-N timing harness the
# reports in `examples/` are measured with.
vitui-bench.workspace = true

[lints]
workspace = true
