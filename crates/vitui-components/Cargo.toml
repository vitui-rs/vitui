[package]
name = "vitui-components"
description = "Windows, panels, charts, lists, trees, forms and pickers built on vitui-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
# `repository` is absent from `workspace.package` on purpose; see the root `Cargo.toml`. Restore
# `repository.workspace = true` here when the key goes back.
rust-version.workspace = true

# **Explicit, and cargo would have found it anyway.** A README in the package directory is
# auto-detected, so this line changes nothing about what gets published — it is here because
# ticket 01's whole finding was that a `rust-version` nobody checked had been switching lints off
# for three releases. A key that is written down is a key a reader can see is wrong.
#
# It is **not** `readme.workspace = true`, and cannot usefully be: the four publishable crates have
# genuinely different stories — the engine is complete, the runtime is half built, the components
# crate is empty — and one shared file would put "components is empty scaffolding" on the engine's
# crates.io page. Nothing gates this; a missing README surfaces as a `cargo publish` that ships a
# blank front page, which is the first publish and not this commit.
readme = "README.md"

[dependencies]
vitui-runtime.workspace = true

# **Dev only, and constraint C6 above is untouched.** `vitui-alloc-probe` is the counting global
# allocator; the engine and the runtime both take it in exactly this place for exactly this reason —
# *no allocation* is a count, and a count needs something that counts.
#
# It does not weaken the one gate that reads this file. `line::tests::the_components_manifest_names_
# only_the_runtime` asserts `dependencies_of(manifest) == ["vitui-runtime"]`, and that helper sets
# `inside = s == "[dependencies]"` on **every** line beginning with `[` — so this table turns it off
# rather than adding to it. The C6 that matters is what a component-facing *library* links, and a
# dev-dependency is not in it: `publish = false`, and no consumer of `vitui` ever compiles it.
#
# What it buys is `tests/budget.rs`, where the two standing budget counts run for the first time from
# a crate that cannot name the engine. See that file's header.
[dev-dependencies]
vitui-alloc-probe.workspace = true

[lints]
workspace = true
